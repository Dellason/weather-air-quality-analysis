<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A year of synthetic daily weather and air-quality readings for Dublin: scrub through the year, see what weather does to the air, and test two classifiers that flag poor air days." />
    <meta name="theme-color" content="#eaf0f4" />
    <script>
      // Resolve the theme before first paint (mirrors src/theme.ts).
      (function () {
        var t = "light";
        try {
          var s = localStorage.getItem("jmd-theme");
          t = s === "light" || s === "dark" ? s : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } catch (e) {
          try { t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } catch (e2) {}
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
        document.querySelector('meta[name="theme-color"]').content = t === "dark" ? "#0f1820" : "#eaf0f4";
      })();
    </script>
    <link rel="icon" href="./ring.svg" type="image/svg+xml" />
    <title>Air, day by day</title>
  </head>
  <body>
    <div class="ambient" aria-hidden="true"></div>
    <div id="root"></div>
    <noscript>This site draws its charts with JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
